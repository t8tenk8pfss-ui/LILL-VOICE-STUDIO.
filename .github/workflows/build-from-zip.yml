
name: Build APK from uploaded ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          unzip -q LILL_VOICE_STUDIO_QWEN3_BUILD_FIX.zip
          test -f LILL_VOICE_STUDIO_NEW/gradlew
          echo "Project archive unpacked successfully"

      - name: Download GGML dependency
        run: |
          mkdir -p LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp
          git clone --depth 1 https://github.com/ggml-org/ggml.git LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build Android APK
        working-directory: LILL_VOICE_STUDIO_NEW
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PqwenNativeBuild=true :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LILL-VOICE-STUDIO-QWEN3-ARM64
          path: LILL_VOICE_STUDIO_NEW/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
