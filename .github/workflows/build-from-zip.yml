name: Build APK from uploaded ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          unzip -q LILL_VOICE_STUDIO_QWEN3_BUILD_FIX.zip
          test -f LILL_VOICE_STUDIO_NEW/gradlew
          test -f LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/CMakeLists.txt
          echo "Project archive unpacked successfully"

      - name: Download GGML revision required by qwen3-tts.cpp
        run: |
          git clone https://github.com/ggml-org/ggml.git LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml
          git -C LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml checkout --detach af97976c7810cdabb1863172f31c432dab767de7
          echo "Pinned GGML revision: $(git -C LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml rev-parse HEAD)"
          grep -R -n "ggml_flash_attn_ext_set_prec" LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml/include
          grep -R -n "ggml_diag_mask_inf" LILL_VOICE_STUDIO_NEW/external/qwen3-tts.cpp/ggml/include
          echo "Required GGML APIs found"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify native build inputs
        working-directory: LILL_VOICE_STUDIO_NEW
        run: |
          test -f external/qwen3-tts.cpp/ggml/include/ggml.h
          test -f app/src/main/cpp/CMakeLists.txt
          grep -R "ggml_flash_attn_ext_set_prec" -n external/qwen3-tts.cpp/src/transformer
          echo "Native build inputs verified"

      - name: Build Android APK
        working-directory: LILL_VOICE_STUDIO_NEW
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PqwenNativeBuild=true :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LILL-VOICE-STUDIO-QWEN3-ARM64
          path: LILL_VOICE_STUDIO_NEW/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
